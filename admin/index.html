<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin DLIFE | Panel definitivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0a0c; color: #fff; padding: 24px; }
    .glass-card { background: rgba(28,28,30,0.6); backdrop-filter: blur(20px); border-radius: 32px; border: 0.5px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .login-box, .admin-container { max-width: 1600px; margin: 0 auto; }
    .login-box { max-width: 420px; margin: 120px auto; padding: 40px; text-align: center; }
    .login-box input, .login-box button { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 44px; border: none; font-size: 1rem; }
    .login-box input { background: #0f0f10; border: 1px solid #2c2c2e; color: white; }
    .login-box button { background: #0071e3; color: white; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .login-box button:hover { background: #005bb5; transform: scale(0.98); }
    .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 32px; gap: 16px; }
    .admin-header h1 { font-size: 1.8rem; font-weight: 600; background: linear-gradient(135deg, #fff, #8e8e93); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .logout-btn { background: #ff453a; border: none; padding: 10px 24px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .logout-btn:hover { background: #ff2a1c; transform: scale(0.96); }
    .tabs { display: flex; gap: 12px; flex-wrap: wrap; border-bottom: 0.5px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 28px; }
    .tab { padding: 10px 20px; border-radius: 40px; cursor: pointer; font-weight: 500; transition: 0.2s; color: #aaa; }
    .tab.active { background: #0071e3; color: white; }
    .tab:hover { background: rgba(255,255,255,0.1); color: white; }
    .table-wrapper { overflow-x: auto; border-radius: 24px; margin-top: 20px; background: rgba(0,0,0,0.2); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 0.5px solid rgba(255,255,255,0.08); }
    th { background: rgba(44,44,46,0.6); color: #aaa; font-weight: 500; }
    button.small { background: #0071e3; border: none; padding: 6px 14px; border-radius: 30px; color: white; margin-right: 8px; cursor: pointer; font-weight: 500; transition: 0.2s; }
    button.small:hover { background: #005bb5; transform: scale(0.96); }
    .danger { background: #ff453a; }
    .danger:hover { background: #d63a2e; }
    .form-modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 2000; overflow-y: auto; padding: 40px 20px; }
    .form-card { background: #1c1c1e; border-radius: 48px; padding: 40px; width: 100%; max-width: 560px; border: 0.5px solid rgba(255,255,255,0.1); }
    .form-card h2 { margin-bottom: 24px; font-size: 1.4rem; font-weight: 600; }
    .form-card input, .form-card select, .form-card textarea { width: 100%; padding: 12px 16px; margin-bottom: 16px; background: #0f0f10; border: 1px solid #2c2c2e; border-radius: 32px; color: white; font-size: 0.95rem; }
    .form-card input:focus, .form-card select:focus, .form-card textarea:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 0 2px rgba(0,113,227,0.1); }
    .form-card textarea { resize: vertical; min-height: 80px; }
    .form-section { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 0.5px solid rgba(255,255,255,0.08); }
    .form-section:last-of-type { border-bottom: none; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .checkbox-group { display: flex; align-items: center; gap: 12px; padding: 16px; background: rgba(255,255,255,0.04); border-radius: 28px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 16px; cursor: pointer; transition: 0.2s; }
    .checkbox-group:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: #0071e3; }
    .checkbox-label { font-size: 0.95rem; font-weight: 500; flex: 1; cursor: pointer; }
    .checkbox-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
    .checkbox-badge.required { background: rgba(255,69,58,0.15); color: #ff453a; }
    .checkbox-badge.optional { background: rgba(94,92,230,0.15); color: #5e5ce6; }
    .imei-field { display: none; }
    .imei-field.show { display: block; }
    .imei-input-wrapper { position: relative; }
    .imei-validation { font-size: 0.75rem; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
    .imei-validation.valid { color: #30d158; }
    .imei-validation.invalid { color: #ff453a; }
    .button-group { display: flex; gap: 12px; margin-top: 24px; }
    .button-group button { flex: 1; }
    .stats-grid { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 32px; }
    .stat-card { background: rgba(28,28,30,0.5); backdrop-filter: blur(12px); border-radius: 28px; padding: 24px; flex: 1; min-width: 180px; text-align: center; border: 0.5px solid rgba(255,255,255,0.05); }
    .stat-card h3 { font-size: 0.9rem; font-weight: 500; color: #aaa; margin-bottom: 8px; }
    .stat-card p { font-size: 2rem; font-weight: 700; }
    .chart-controls { background: rgba(28,28,30,0.5); backdrop-filter: blur(12px); border-radius: 28px; padding: 16px 24px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
    .chart-controls select, .chart-controls button { background: #0f0f10; border: 1px solid #2c2c2e; border-radius: 40px; padding: 10px 20px; color: white; cursor: pointer; font-size: 0.9rem; }
    .chart-controls button { background: #0071e3; border: none; }
    .chart-container { background: rgba(28,28,30,0.4); border-radius: 32px; padding: 24px; margin-bottom: 32px; }
    canvas { max-height: 420px; width: 100%; }
    .hidden { display: none; }
    .status { display: inline-block; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; font-weight: 600; text-transform: capitalize; }
    .status.pendiente { background: rgba(255,159,10,0.2); color: #ff9f0a; }
    .status.completada { background: rgba(48,209,88,0.2); color: #30d158; }
    .status.completado { background: rgba(48,209,88,0.2); color: #30d158; }
    .status.en_progreso { background: rgba(94,92,230,0.2); color: #5e5ce6; }
    .status.cancelado { background: rgba(255,69,58,0.2); color: #ff453a; }
    .status.activa { background: rgba(48,209,88,0.15); color: #30d158; }
    .status.anulada { background: rgba(255,69,58,0.15); color: #ff453a; }
    .status.reclamada { background: rgba(255,159,10,0.15); color: #ff9f0a; }
    .empty-message { text-align: center; padding: 30px; color: #aaa; font-style: italic; }
    .panel-toolbar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center; }
    .search-input { background: #0f0f10; border: 1px solid #2c2c2e; border-radius: 40px; padding: 10px 18px; color: white; font-size: 0.9rem; min-width: 240px; flex: 1; max-width: 360px; }
    .status-select { background: #0f0f10; color: white; border: 1px solid #2c2c2e; border-radius: 30px; padding: 6px 10px; font-size: 0.78rem; text-transform: capitalize; cursor: pointer; }
    .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 3000; max-width: 320px; }
    .toast { padding: 14px 18px; border-radius: 16px; background: #1c1c1e; border: 0.5px solid rgba(255,255,255,0.12); box-shadow: 0 8px 24px rgba(0,0,0,0.35); font-size: 0.88rem; animation: toastIn .25s ease; }
    .toast.success { border-left: 4px solid #30d158; }
    .toast.error { border-left: 4px solid #ff453a; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .client-row-summary { font-size: 0.78rem; color: #aaa; }
    .purchase-list { max-height: 320px; overflow-y: auto; text-align: left; margin-top: 8px; }
    .purchase-list div { padding: 8px 0; border-bottom: 0.5px solid rgba(255,255,255,0.08); font-size: 0.85rem; }
    .guarantee-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.65rem; font-weight: 600; margin-left: 6px; }
    .guarantee-badge.with { background: rgba(48,209,88,0.2); color: #30d158; }
    .guarantee-badge.without { background: rgba(94,92,230,0.2); color: #5e5ce6; }
  </style>
</head>
<body>
<div id="app">
  <div id="loginContainer" class="login-box glass-card">
    <h2 style="margin-bottom: 24px;">Acceso Administrador</h2>
    <input type="email" id="adminEmail" placeholder="Email">
    <input type="password" id="adminPassword" placeholder="Contraseña">
    <button id="loginButton">Ingresar</button>
  </div>
  <div id="adminContainer" class="admin-container hidden">
    <div class="admin-header">
      <h1 id="appTitle" style="cursor: default;"><i class="fas fa-chart-line"></i> Panel DLIFE</h1>
      <button id="logoutBtn" class="logout-btn">Cerrar sesión</button>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="productos">📦 Productos</div>
      <div class="tab" data-tab="accesorios">📱 Accesorios</div>
      <div class="tab" data-tab="solicitudes">📋 Solicitudes venta</div>
      <div class="tab" data-tab="clientes">👥 Historial clientes</div>
      <div class="tab" data-tab="facturacion">🧾 Facturación</div>
      <div class="tab" data-tab="puntos">🏆 Puntos y referidos</div>
      <div class="tab" data-tab="reparaciones">🔧 Reparaciones</div>
      <div class="tab" data-tab="graficas">📊 Gráficas</div>
    </div>
    <div id="productosPanel"></div>
    <div id="accesoriosPanel" class="hidden"></div>
    <div id="solicitudesPanel" class="hidden"></div>
    <div id="clientesPanel" class="hidden"></div>
    <div id="facturacionPanel" class="hidden"></div>
    <div id="puntosPanel" class="hidden"></div>
    <div id="ventasRegistradasPanel" class="hidden"></div>
    <div id="reparacionesPanel" class="hidden"></div>
    <div id="graficasPanel" class="hidden"></div>
  </div>
</div>
<script>
  /* =================================================================
     VERSIÓN 2.0 - CAMBIOS PRINCIPALES:
     1. Garantías: al confirmar venta, pregunta si incluye garantía.
        Si SÍ → campo IMEI obligatorio (15 dígitos, validado)
        Si NO → sin IMEI, sin fila en tabla `garantias`
     2. Diseño de modales mejorado: secciones visuales claras,
        mejor jerarquía de información, validación inline.
     3. Mejoras estéticas: mejor enfoque en los inputs, checkboxes
        más visuales, colores para distinguir garantía/sin garantía.
     4. Badges de garantía en la tabla de solicitudes.
     ================================================================= */

  const adminSupabase = window.supabase.createClient(
    'https://erkethlmokmjoooucbsb.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVya2V0aGxtb2ttam9vb3VjYnNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2OTc2NDAsImV4cCI6MjA5MTI3MzY0MH0.qKKJjpeLP36Oy-wyujknq3ukA7F4JodGBvAEpx74v2M'
  );

  const ADMIN_EMAILS = [];

  // Codigo de acceso a la seccion oculta "Ventas registradas". Cambialo por
  // el que prefieras. Esto NO es seguridad real (vive en el codigo fuente),
  // es solo para que colaboradores no se topen con esta seccion por curiosidad.
  const CODIGO_VENTAS_REGISTRADAS = '2606';

  let currentUser = null;
  let productos = [], accesorios = [], reparaciones = [], ventasReales = [], solicitudesVenta = [], garantias = [], facturas = [], referidos = [];
  let activeModal = null;
  let currentChart = null;
  let currentChartType = localStorage.getItem('adminChartType') || 'mensual';
  let currentChartStyle = localStorage.getItem('adminChartStyle') || 'bar';

  // ================= UTILIDADES =================
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function formatCurrency(n) {
    return 'RD$' + Number(n || 0).toLocaleString('es-DO');
  }

  function matches(text, query) {
    return String(text || '').toLowerCase().includes(String(query || '').toLowerCase());
  }

  function validateIMEI(imei) {
    const cleaned = (imei || '').replace(/\D/g, '');
    return cleaned.length === 15;
  }

  function showToast(message, type = 'success', duration = 3500) {
    let container = document.getElementById('toastContainer');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toastContainer';
      container.className = 'toast-container';
      document.body.appendChild(container);
    }
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), duration);
  }

  function showModal(content) {
    if (activeModal) activeModal.remove();
    const modal = document.createElement('div');
    modal.className = 'form-modal';
    modal.innerHTML = `<div class="form-card">${content}</div>`;
    document.body.appendChild(modal);
    activeModal = modal;
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
  }
  function closeModal() { if (activeModal) activeModal.remove(); activeModal = null; }

  function showConfirm(message, onConfirm, confirmText = 'Confirmar') {
    const html = `
      <h2 style="margin-bottom:20px; font-size:1.1rem;">${escapeHtml(message)}</h2>
      <div class="button-group">
        <button id="confirmYesBtn" class="small" style="flex:1;">${escapeHtml(confirmText)}</button>
        <button id="confirmNoBtn" class="small danger" style="flex:1;">Cancelar</button>
      </div>`;
    showModal(html);
    document.getElementById('confirmYesBtn').onclick = () => { closeModal(); onConfirm(); };
    document.getElementById('confirmNoBtn').onclick = () => closeModal();
  }

  function getStoragePathFromUrl(url, bucket) {
    if (!url) return null;
    const marker = `/storage/v1/object/public/${bucket}/`;
    const idx = url.indexOf(marker);
    if (idx === -1) return null;
    return url.substring(idx + marker.length);
  }

  async function uploadImage(file, bucket, oldUrl) {
    const ext = file.name.split('.').pop();
    const fileName = `${Date.now()}.${ext}`;
    const { error } = await adminSupabase.storage.from(bucket).upload(fileName, file);
    if (error) { showToast('Error subiendo imagen: ' + error.message, 'error'); return null; }
    if (oldUrl) {
      const oldPath = getStoragePathFromUrl(oldUrl, bucket);
      if (oldPath) adminSupabase.storage.from(bucket).remove([oldPath]).catch(() => {});
    }
    return adminSupabase.storage.from(bucket).getPublicUrl(fileName).data.publicUrl;
  }

  // ================= SESIÓN =================
  async function checkSession() {
    const { data: { session } } = await adminSupabase.auth.getSession();
    if (session && ADMIN_EMAILS.length && !ADMIN_EMAILS.includes(session.user.email)) {
      await adminSupabase.auth.signOut();
      showToast('Este usuario no tiene acceso al panel.', 'error');
      document.getElementById('loginContainer').classList.remove('hidden');
      document.getElementById('adminContainer').classList.add('hidden');
      return;
    }
    if (session) {
      currentUser = session.user;
      document.getElementById('loginContainer').classList.add('hidden');
      document.getElementById('adminContainer').classList.remove('hidden');
      await loadAllData();
    } else {
      document.getElementById('loginContainer').classList.remove('hidden');
      document.getElementById('adminContainer').classList.add('hidden');
    }
  }

  // ================= CARGA DE DATOS =================
  async function fetchTable(table, orderBy, ascending = true) {
    const { data, error } = await adminSupabase.from(table).select('*').order(orderBy, { ascending });
    if (error) {
      console.error(`Error cargando ${table}:`, error);
      showToast(`Error cargando ${table}: ${error.message}`, 'error');
      return [];
    }
    return data || [];
  }
  async function loadProductos() { productos = await fetchTable('productos', 'id'); }
  async function loadAccesorios() { accesorios = await fetchTable('accesorios', 'id'); }
  async function loadReparaciones() { reparaciones = await fetchTable('reparaciones', 'creado_en', false); }
  async function loadVentasReales() { ventasReales = await fetchTable('ventas_realizadas', 'fecha', false); }
  async function loadSolicitudesVenta() { solicitudesVenta = await fetchTable('ventas_contactos', 'creado_en', false); }
  async function loadGarantias() { garantias = await fetchTable('garantias', 'creado_en', false); }
  async function loadFacturas() { facturas = await fetchTable('facturas', 'creado_en', false); }
  async function loadReferidos() { referidos = await fetchTable('referidos', 'creado_en', false); }

  const LOADERS = { 
    productos: loadProductos, accesorios: loadAccesorios, 
    reparaciones: loadReparaciones, ventasReales: loadVentasReales, 
    solicitudesVenta: loadSolicitudesVenta, garantias: loadGarantias,
    facturas: loadFacturas, referidos: loadReferidos
  };

  async function refresh(keys) {
    await Promise.all(keys.map(k => LOADERS[k] ? LOADERS[k]() : Promise.resolve()));
    if (keys.includes('productos')) renderProductos();
    if (keys.includes('accesorios')) renderAccesorios();
    if (keys.includes('reparaciones')) renderReparaciones();
    if (keys.includes('solicitudesVenta')) { renderSolicitudes(); renderClientes(); }
    if (keys.includes('ventasReales')) renderVentasRegistradas();
    if (keys.includes('facturas')) renderFacturacion();
    const puntosVisible = !document.getElementById('puntosPanel').classList.contains('hidden');
    if (puntosVisible && (keys.includes('referidos') || keys.includes('solicitudesVenta') || keys.includes('productos') || keys.includes('accesorios'))) {
      renderPuntos();
    }
    const graficasVisible = !document.getElementById('graficasPanel').classList.contains('hidden');
    if (graficasVisible && (keys.includes('ventasReales') || keys.includes('solicitudesVenta') || keys.includes('productos') || keys.includes('accesorios'))) {
      renderGraficas();
    }
  }

  async function loadAllData() {
    await Promise.all(Object.values(LOADERS).map(fn => fn()));
    renderProductos();
    renderAccesorios();
    renderSolicitudes();
    renderClientes();
    renderVentasRegistradas();
    renderFacturacion();
    renderPuntos();
    renderReparaciones();
    renderGraficas();
  }

  // ================= PRODUCTOS =================
  function renderProductos() {
    const panel = document.getElementById('productosPanel');
    if (!panel) return;
    panel.innerHTML = `
      <div class="panel-toolbar">
        <button id="addProductoBtn" class="small">+ Agregar Producto</button>
        <input type="text" id="productosSearch" class="search-input" placeholder="🔍 Buscar producto...">
      </div>
      <div id="productosTableContainer"></div>`;
    document.getElementById('addProductoBtn').onclick = () => showProductoForm();
    document.getElementById('productosSearch').addEventListener('input', (e) => renderProductosTable(e.target.value));
    renderProductosTable('');
  }

  function renderProductosTable(query = '') {
    const container = document.getElementById('productosTableContainer');
    if (!container) return;
    const filtrados = productos.filter(p => !query || matches(p.nombre, query) || matches(p.tipo, query));
    if (filtrados.length === 0) {
      container.innerHTML = `<div class="empty-message">${productos.length === 0 ? 'No hay productos registrados' : 'Sin resultados para tu búsqueda'}</div>`;
      return;
    }
    let html = `<div class="table-wrapper"><table><thead><tr><th>ID</th><th>Nombre</th><th>Tipo</th><th>Precio</th><th>Puntos</th><th>Stock</th><th>Imagen</th><th>Acciones</th></tr></thead><tbody>`;
    filtrados.forEach(p => {
      html += `<tr data-id="${p.id}">
        <td>${p.id}</td>
        <td>${escapeHtml(p.nombre)}</td>
        <td>${escapeHtml(p.tipo)}</td>
        <td>${formatCurrency(p.precio)}</td>
        <td>${p.puntos || 0}</td>
        <td>${p.stock}</td>
        <td>${p.imagen_url ? `<img src="${escapeHtml(p.imagen_url)}" width="40">` : '—'}</td>
        <td><button class="small" data-action="edit">Editar</button><button class="small danger" data-action="delete">Eliminar</button></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
    container.innerHTML = html;
    container.querySelector('table').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const id = Number(btn.closest('tr').dataset.id);
      if (btn.dataset.action === 'edit') editProducto(id);
      if (btn.dataset.action === 'delete') deleteProducto(id);
    });
  }

  // ================= ACCESORIOS =================
  function renderAccesorios() {
    const panel = document.getElementById('accesoriosPanel');
    if (!panel) return;
    panel.innerHTML = `
      <div class="panel-toolbar">
        <button id="addAccesorioBtn" class="small">+ Agregar Accesorio</button>
        <input type="text" id="accesoriosSearch" class="search-input" placeholder="🔍 Buscar accesorio...">
      </div>
      <div id="accesoriosTableContainer"></div>`;
    document.getElementById('addAccesorioBtn').onclick = () => showAccesorioForm();
    document.getElementById('accesoriosSearch').addEventListener('input', (e) => renderAccesoriosTable(e.target.value));
    renderAccesoriosTable('');
  }

  function renderAccesoriosTable(query = '') {
    const container = document.getElementById('accesoriosTableContainer');
    if (!container) return;
    const filtrados = accesorios.filter(a => !query || matches(a.nombre, query));

  function showEntityForm(config, item = null) {
    const isEdit = !!item;
    const inputsHtml = config.fields.map(f => {
      const val = item ? (item[f.key] ?? '') : '';
      return `<input id="field_${f.key}" type="${f.type}" placeholder="${escapeHtml(f.label)}" value="${escapeHtml(val)}">`;
    }).join('');
    const html = `
      <h2>${isEdit ? config.titleEdit : config.titleNew}</h2>
      ${inputsHtml}
      <input id="field_imagen_url" type="text" placeholder="URL de imagen" value="${escapeHtml(item?.imagen_url || '')}">
      <input type="file" id="field_imagen_file" accept="image/*">
      <div class="button-group" style="margin-top:24px;">
        <button id="saveEntityBtn" class="small">Guardar</button>
      </div>`;
    showModal(html);
    document.getElementById('saveEntityBtn').onclick = async () => {
      const payload = {};
      for (const f of config.fields) {
        const raw = document.getElementById(`field_${f.key}`).value.trim();
        if (f.type === 'number') {
          const num = Number(raw);
          if (f.required && (raw === '' || isNaN(num))) {
            showToast(`"${f.label}" debe ser un número válido.`, 'error');
            return;
          }
          payload[f.key] = raw === '' ? null : num;
        } else {
          if (f.required && raw === '') {
            showToast(`"${f.label}" es obligatorio.`, 'error');
            return;
          }
          payload[f.key] = raw;
        }
      }
      let imagen_url = document.getElementById('field_imagen_url').value.trim();
      const file = document.getElementById('field_imagen_file').files[0];
      if (file) {
        const uploaded = await uploadImage(file, config.bucket, item?.imagen_url);
        if (uploaded) imagen_url = uploaded;
      }
      payload.imagen_url = imagen_url;

      const query = isEdit
        ? adminSupabase.from(config.table).update(payload).eq('id', item.id)
        : adminSupabase.from(config.table).insert([payload]);
      const { error } = await query;
      if (error) { showToast('Error guardando: ' + error.message, 'error'); return; }
      closeModal();
      showToast(isEdit ? 'Actualizado correctamente.' : 'Agregado correctamente.', 'success');
      await config.afterSave();
    };
  }

  function confirmarVentaModal(idSolicitud) {
    const solicitud = solicitudesVenta.find(s => s.id === idSolicitud);

    let producto = productos.find(p => p.nombre === solicitud.producto);

    if (!producto) { showToast('Producto no encontrado en el catálogo.', 'error'); return; }

    const cantidadSolicitada = solicitud.cantidad || 1;
    if (producto.stock <= 0) { showToast(`Stock insuficiente de ${producto.nombre}`, 'error'); return; }

    const html = `
      <h2>Confirmar venta</h2>
      <div class="form-section">
        <label class="form-label">Detalles de la venta</label>
        <div style="padding: 12px; background: rgba(255,255,255,0.04); border-radius: 20px; margin-bottom: 16px;">
          <div style="font-weight: 600; margin-bottom: 8px;">${escapeHtml(producto.nombre)}</div>
          <div style="font-size: 0.85rem; color: #aaa;">Cliente: ${escapeHtml(solicitud.nombre)} · ${escapeHtml(solicitud.telefono)}</div>
          <div style="font-size: 0.85rem; color: #aaa;">Stock disponible: ${producto.stock}</div>
        </div>
      </div>

      <div class="form-section">
        <label class="form-label">Cantidad a confirmar</label>
        <input type="number" id="cantidadInput" min="1" max="${producto.stock}" value="${Math.min(cantidadSolicitada, producto.stock)}">
        <div class="imei-validation" id="cantidadValidation" style="display:none;"></div>
      </div>

      <div class="form-section">
        <label class="checkbox-group">
          <input type="checkbox" id="tieneGarantia" checked>
          <span class="checkbox-label">¿Incluye garantía?</span>
          <span class="checkbox-badge required" id="garantiaBadge">Obligatorio IMEI</span>
        </label>
      </div>

      <div class="imei-field show" id="imeiField">
        <label class="form-label">IMEI por equipo</label>
        <div id="imeiInputsContainer"></div>
      </div>

      <div class="button-group" style="margin-top: 24px;">
        <button id="confirmVentaBtn" class="small">Confirmar venta</button>
        <button id="cancelVentaBtn" class="small danger">Cancelar</button>
      </div>`;

    showModal(html);

    const checkbox = document.getElementById('tieneGarantia');
    const imeiField = document.getElementById('imeiField');
    const imeiInputsContainer = document.getElementById('imeiInputsContainer');
    const garantiaBadge = document.getElementById('garantiaBadge');
    const cantidadInput = document.getElementById('cantidadInput');
    const cantidadValidation = document.getElementById('cantidadValidation');

    function renderImeiInputs() {
      const cantidad = Math.max(1, parseInt(cantidadInput.value) || 1);
      imeiInputsContainer.innerHTML = '';
      for (let i = 0; i < cantidad; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'imei-input-wrapper';
        wrapper.style.marginBottom = '10px';
        wrapper.innerHTML = `
          <input type="text" class="imei-unit-input" data-index="${i}" placeholder="IMEI equipo ${i + 1} de ${cantidad}" inputmode="numeric">
          <div class="imei-validation" data-validation-for="${i}" style="display:none;"></div>`;
        imeiInputsContainer.appendChild(wrapper);
      }
      imeiInputsContainer.querySelectorAll('.imei-unit-input').forEach(input => {
        input.addEventListener('input', () => validateImeiUnit(input));
      });
    }

    function validateImeiUnit(input) {
      const idx = input.dataset.index;
      const validationDiv = imeiInputsContainer.querySelector(`[data-validation-for="${idx}"]`);
      const val = input.value.trim();
      if (val === '') { validationDiv.style.display = 'none'; return; }
      const isValid = validateIMEI(val);
      validationDiv.style.display = 'flex';
      if (isValid) {
        validationDiv.className = 'imei-validation valid';
        validationDiv.innerHTML = '<i class="fas fa-check-circle"></i> <span>IMEI válido</span>';
      } else {
        const digitos = val.replace(/\D/g, '').length;
        validationDiv.className = 'imei-validation invalid';
        validationDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> <span>Se requieren 15 dígitos (${digitos} detectados)</span>`;
      }
    }

    function validarCantidad() {
      const cantidad = parseInt(cantidadInput.value) || 0;
      if (cantidad < 1 || cantidad > producto.stock) {
        cantidadValidation.style.display = 'flex';
        cantidadValidation.className = 'imei-validation invalid';
        cantidadValidation.innerHTML = `<i class="fas fa-exclamation-circle"></i> <span>Debe ser entre 1 y ${producto.stock} (stock disponible)</span>`;
        return false;
      }
      cantidadValidation.style.display = 'none';
      return true;
    }

    cantidadInput.addEventListener('input', () => {
      validarCantidad();
      if (checkbox.checked) renderImeiInputs();
    });

    checkbox.addEventListener('change', () => {
      if (checkbox.checked) {
        imeiField.classList.add('show');
        garantiaBadge.className = 'checkbox-badge required';

      if (!validarCantidad()) {
        showToast(`La cantidad debe ser entre 1 y ${producto.stock}.`, 'error');
        return;
      }

      const tieneGarantia = checkbox.checked;
      let imeis = [];
      if (tieneGarantia) {
        const inputs = Array.from(imeiInputsContainer.querySelectorAll('.imei-unit-input'));
        imeis = inputs.map(i => i.value.trim());
        const todosValidos = imeis.length === cantidad && imeis.every(validateIMEI);
        if (!todosValidos) {
          showToast(`Ingresa un IMEI válido (15 dígitos) para cada uno de los ${cantidad} equipos.`, 'error');
          return;
        }
      }

      await confirmarVenta(idSolicitud, producto, tipo, tieneGarantia, imeis, cantidad);
    };
    document.getElementById('cancelVentaBtn').onclick = closeModal;
  }

  async function confirmarVenta(idSolicitud, producto, tipo, tieneGarantia, imeis, cantidad) {
    const solicitudOriginal = solicitudesVenta.find(s => s.id === idSolicitud);
    const nuevoStock = producto.stock - cantidad;
    const tableStock = tipo === 'producto' ? 'productos' : 'accesorios';

    const { error: stockError } = await adminSupabase.from(tableStock).update({ stock: nuevoStock }).eq('id', producto.id);
    if (stockError) { showToast('Error actualizando stock: ' + stockError.message, 'error'); return; }

    const ventaData = {
      producto_id: tipo === 'producto' ? producto.id : null,
      nombre_item: producto.nombre,
      tipo_item: tipo,
      cantidad: cantidad,
      total: producto.precio * cantidad,
      fecha: new Date(),
      imei: tieneGarantia ? imeis.join(', ') : null,
      cliente_nombre: solicitudOriginal?.nombre || null,
      cliente_telefono: solicitudOriginal?.telefono || null,
      solicitud_id: idSolicitud
    };
    const { data: ventaInserted, error: ventaError } = await adminSupabase.from('ventas_realizadas').insert([ventaData]).select();
    if (ventaError) { showToast('Error registrando venta: ' + ventaError.message, 'error'); return; }
    const ventaId = ventaInserted?.[0]?.id;

    if (tieneGarantia && ventaId) {
      const vistaHasta = new Date();
      vistaHasta.setFullYear(vistaHasta.getFullYear() + 1);
      const filasGarantia = imeis.map(imei => ({
        venta_id: ventaId,
        imei: imei,
        dispositivo: producto.nombre,
        estado: 'activa',
        vigencia_hasta: vistaHasta.toISOString().split('T')[0],
        creado_en: new Date().toISOString()
      }));
      const { error: garantiaError } = await adminSupabase.from('garantias').insert(filasGarantia);
      if (garantiaError) showToast('Garantía no guardada: ' + garantiaError.message, 'error');
    }

    const { error: estadoError } = await adminSupabase.from('ventas_contactos').update({ estado: 'completada' }).eq('id', idSolicitud);
    if (estadoError) { showToast('Error actualizando la solicitud: ' + estadoError.message, 'error'); return; }

    closeModal();
    showToast('Venta confirmada. Stock actualizado' + (tieneGarantia ? ' y garantía registrada.' : '.'), 'success');
    await refresh(['productos', 'accesorios', 'ventasReales', 'solicitudesVenta', 'garantias']);
  }

  function eliminarSolicitud(idSolicitud) {

  // ================= HISTORIAL DE CLIENTES =================
  function getClienteKey(s) {
    return (s.telefono || s.email || s.nombre || 'desconocido').toString().trim().toLowerCase();
  }

  // Busca la venta real correspondiente a una solicitud completada, para usar
  // su precio y cantidad reales en vez de adivinar con el precio actual del
  // catalogo (que falla si el producto fue borrado o renombrado despues).
  // 1) Coincidencia exacta por solicitud_id (ventas confirmadas desde este fix en adelante).
  // 2) Respaldo para ventas antiguas: mismo producto + mismo telefono, la mas cercana en fecha.
  function encontrarVentaParaSolicitud(s) {
    let venta = ventasReales.find(v => v.solicitud_id === s.id);
    if (venta) return venta;
    const mismoProducto = ventasReales.filter(v => v.nombre_item === s.producto);
    if (mismoProducto.length === 0) return null;
    const conTelefono = s.telefono ? mismoProducto.filter(v => v.cliente_telefono === s.telefono) : [];
    const candidatas = conTelefono.length > 0 ? conTelefono : mismoProducto;
    candidatas.sort((a, b) => Math.abs(new Date(a.fecha) - new Date(s.creado_en)) - Math.abs(new Date(b.fecha) - new Date(s.creado_en)));
    return candidatas[0] || null;
  }

  function agruparClientes() {
    const completadas = solicitudesVenta.filter(s => s.estado === 'completada');
    const grupos = new Map();
    completadas.forEach(s => {
      const key = getClienteKey(s);
      if (!grupos.has(key)) {
        grupos.set(key, { key, nombre: s.nombre, telefono: s.telefono, email: s.email, compras: [], totalGastado: 0, ultimaCompra: s.creado_en });
      }
      const cliente = grupos.get(key);
      const ventaMatch = encontrarVentaParaSolicitud(s);
      let precioUnitario, cantidad;
      if (ventaMatch) {
        cantidad = ventaMatch.cantidad || 1;
        precioUnitario = cantidad > 0 ? (ventaMatch.total || 0) / cantidad : (ventaMatch.total || 0);
      } else {
        const item = productos.find(p => p.nombre === s.producto) || accesorios.find(a => a.nombre === s.producto);
        precioUnitario = item ? Number(item.precio) || 0 : 0;
        cantidad = s.cantidad || 1;
      }
      const tieneGarantia = garantias.some(g => g.nombre_item === s.producto);
      cliente.compras.push({ producto: s.producto, orden: s.orden, fecha: s.creado_en, precio: precioUnitario, cantidad, tieneGarantia, ventaId: ventaMatch ? ventaMatch.id : null });
      cliente.totalGastado += precioUnitario * cantidad;
      if (new Date(s.creado_en) > new Date(cliente.ultimaCompra)) {
        cliente.ultimaCompra = s.creado_en;
        cliente.nombre = s.nombre; cliente.telefono = s.telefono; cliente.email = s.email;
      }
    });
    return Array.from(grupos.values()).sort((a, b) => new Date(b.ultimaCompra) - new Date(a.ultimaCompra));
  }

    }
    let html = `<div class="table-wrapper"><table><thead><tr><th>Cliente</th><th>Teléfono</th><th>Email</th><th># Compras</th><th>Total gastado (est.)</th><th>Última compra</th><th>Acciones</th></tr></thead><tbody>`;

      </tr>`;
    });
    html += `</tbody></table></div>
      <p style="margin-top:14px; font-size:0.78rem; color:#888;">* Total gastado estimado con el precio actual del catálogo.</p>`;
    container.innerHTML = html;

  function verComprasCliente(cliente) {
    const comprasHtml = cliente.compras
      .slice()
      .sort((a, b) => new Date(b.fecha) - new Date(a.fecha))
      .map(c => `<div><strong>${escapeHtml(c.producto)}</strong>${c.cantidad > 1 ? ` x${c.cantidad}` : ''}${c.tieneGarantia ? '<span class="guarantee-badge with">Con garantía</span>' : ''}<br><span class="client-row-summary">Orden: ${escapeHtml(c.orden || 'N/A')} · ${new Date(c.fecha).toLocaleDateString()} · ${formatCurrency(c.precio * c.cantidad)}</span></div>`)
      .join('');
    const html = `
      <h2 style="margin-bottom:8px;">${escapeHtml(cliente.nombre)}</h2>

  // ================= REPARACIONES =================
  function renderReparaciones() {
    const panel = document.getElementById('reparacionesPanel');
    if (!panel) return;
    panel.innerHTML = `
      <div class="panel-toolbar">
        <input type="text" id="reparacionesSearch" class="search-input" placeholder="🔍 Buscar por cliente, orden o dispositivo...">
      </div>
      <div id="reparacionesTableContainer"></div>`;
    document.getElementById('reparacionesSearch').addEventListener('input', (e) => renderReparacionesTable(e.target.value));
    renderReparacionesTable('');
  }

  function renderReparacionesTable(query = '') {
    const container = document.getElementById('reparacionesTableContainer');
    if (!container) return;
    const filtradas = reparaciones.filter(r => !query || matches(r.nombre, query) || matches(r.orden, query) || matches(r.dispositivo, query));
    if (filtradas.length === 0) {
      container.innerHTML = `<div class="empty-message">${reparaciones.length === 0 ? 'No hay reparaciones registradas' : 'Sin resultados para tu búsqueda'}</div>`;
      return;
    }
    const ESTADOS = ['pendiente', 'en_progreso', 'completado', 'cancelado'];
    let html = `<div class="table-wrapper"><table><thead><tr><th>ID</th><th>Orden</th><th>Cliente</th><th>Dispositivo</th><th>Problema</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>`;
    filtradas.forEach(r => {
      const estado = r.estado || 'pendiente';
      const opciones = ESTADOS.map(e => `<option value="${e}" ${e === estado ? 'selected' : ''}>${e.replace('_', ' ')}</option>`).join('');
      html += `<tr data-id="${r.id}">
        <td>${r.id}</td>
        <td>${escapeHtml(r.orden || 'N/A')}</td>
        <td>${escapeHtml(r.nombre)}</td>
        <td>${escapeHtml(r.dispositivo || '')} ${escapeHtml(r.modelo || '')}</td>
        <td>${escapeHtml((r.problema || '').substring(0, 40))}</td>
        <td><span class="status ${estado}">${estado.replace('_', ' ')}</span></td>
        <td>${new Date(r.creado_en).toLocaleDateString()}</td>
        <td>
          <select class="status-select" data-action="estado">${opciones}</select>
          <button class="small" data-action="editar">Editar</button>
          <button class="small" data-action="factura">Generar factura</button>
          <button class="small danger" data-action="eliminar">Eliminar</button>
        </td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
    container.innerHTML = html;
    container.querySelector('table').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const id = Number(btn.closest('tr').dataset.id);
      if (btn.dataset.action === 'eliminar') eliminarRep(id);
      if (btn.dataset.action === 'editar') editarReparacion(id);
      if (btn.dataset.action === 'factura') generarFacturaDesdeReparacion(id);
    });
    container.querySelector('table').addEventListener('change', (e) => {
      const sel = e.target.closest('select[data-action="estado"]');
      if (!sel) return;
      const id = Number(sel.closest('tr').dataset.id);
      cambiarEstadoRep(id, sel.value);
    });
  }

  async function cambiarEstadoRep(id, estado) {
    const { error } = await adminSupabase.from('reparaciones').update({ estado }).eq('id', id);
    if (error) { showToast('Error actualizando estado: ' + error.message, 'error'); return; }
    showToast('Estado actualizado.', 'success');
    await refresh(['reparaciones']);
  }
  function eliminarRep(id) {
    showConfirm('¿Eliminar esta reparación?', async () => {
      const { error } = await adminSupabase.from('reparaciones').delete().eq('id', id);
      if (error) { showToast('Error eliminando: ' + error.message, 'error'); return; }
      showToast('Reparación eliminada.', 'success');
      await refresh(['reparaciones']);
    });
  }

  function editarReparacion(id) {
    const rep = reparaciones.find(r => r.id === id);
    if (!rep) { showToast('Reparación no encontrada.', 'error'); return; }
    const html = `
      <h2>Editar reparación #${id}</h2>
      <label class="form-label">Trabajo realizado / solución</label>
      <input type="text" id="repSolucion" placeholder="Ej: Cambio de pantalla" value="${escapeHtml(rep.solucion || '')}">
      <label class="form-label">Precio cobrado RD$</label>
      <input type="number" id="repPrecio" min="0" value="${rep.precio || ''}">
      <div class="button-group" style="margin-top:20px;">
        <button id="guardarRepBtn" class="small">Guardar</button>
        <button id="cancelarRepBtn" class="small danger">Cancelar</button>
      </div>`;
    showModal(html);
    document.getElementById('guardarRepBtn').onclick = async () => {
      const solucion = document.getElementById('repSolucion').value.trim();
      const precioRaw = document.getElementById('repPrecio').value;
      const precio = precioRaw === '' ? null : Number(precioRaw);
      const { error } = await adminSupabase.from('reparaciones').update({ solucion, precio }).eq('id', id);
      if (error) { showToast('Error guardando: ' + error.message, 'error'); return; }
      closeModal();
      showToast('Reparación actualizada.', 'success');
      await refresh(['reparaciones']);
    };
    document.getElementById('cancelarRepBtn').onclick = closeModal;
  }

  function generarFacturaDesdeReparacion(id) {
    const rep = reparaciones.find(r => r.id === id);
    if (!rep) { showToast('Reparación no encontrada.', 'error'); return; }
    showFacturaForm({
      tipo: 'servicio',
      dispositivo: `${rep.dispositivo || ''} ${rep.modelo || ''}`.trim(),
      producto: rep.solucion || rep.problema || 'Reparación',
      precio: rep.precio || '',
      cantidad: 1,
      fecha_venta: rep.creado_en ? new Date(rep.creado_en).toISOString().split('T')[0] : new Date().toISOString().split('T')[0],
      cliente_nombre: rep.nombre || '',
      cliente_telefono: rep.telefono || '',
      reparacion_id: rep.id
    });
  }

  // ================= VENTAS REGISTRADAS (corregir cantidad/total) =================
  // Las graficas e ingresos se calculan sumando directo lo que esta guardado
  // en ventas_realizadas. Esta vista permite ver y corregir cada venta
  // individual (por ejemplo, registros antiguos guardados antes de que el
  // panel calculara correctamente cantidad x precio).
  function renderVentasRegistradas() {
    const panel = document.getElementById('ventasRegistradasPanel');
    if (!panel) return;
    panel.innerHTML = `
      <div class="panel-toolbar">
        <input type="text" id="ventasRegSearch" class="search-input" placeholder="🔍 Buscar por producto o IMEI...">
      </div>
      <p style="font-size:0.78rem; color:#888; margin-bottom:14px;">Si un total no coincide con cantidad × precio, corrígelo aquí — las gráficas e ingresos usan estos valores directamente.</p>
      <div id="ventasRegTableContainer"></div>`;
    document.getElementById('ventasRegSearch').addEventListener('input', (e) => renderVentasRegistradasTable(e.target.value));
    renderVentasRegistradasTable('');
  }

  function renderVentasRegistradasTable(query = '') {
    const container = document.getElementById('ventasRegTableContainer');
    if (!container) return;
    const filtradas = ventasReales.filter(v => !query || matches(v.nombre_item, query) || matches(v.imei, query));
    if (filtradas.length === 0) {
      container.innerHTML = `<div class="empty-message">${ventasReales.length === 0 ? 'No hay ventas registradas todavía' : 'Sin resultados para tu búsqueda'}</div>`;
      return;
    }
    let html = `<div class="table-wrapper"><table><thead><tr><th>ID</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Total</th><th>IMEI</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>`;
    filtradas.forEach(v => {
      const cantidad = v.cantidad || 1;
      const total = Number(v.total) || 0;
      const esperado = cantidad > 0 ? total / cantidad : total;
      html += `<tr data-id="${v.id}">
        <td>${v.id}</td>
        <td>${escapeHtml(v.nombre_item)}</td>
        <td>${escapeHtml(v.tipo_item || '—')}</td>
        <td>${cantidad}</td>
        <td>${formatCurrency(total)}</td>
        <td>${escapeHtml(v.imei || '—')}</td>
        <td>${new Date(v.fecha).toLocaleDateString()}</td>
        <td><button class="small" data-action="editar">Corregir</button><button class="small" data-action="factura">Generar factura</button><button class="small danger" data-action="eliminar">Eliminar</button></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
    container.innerHTML = html;
    container.querySelector('table').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const id = Number(btn.closest('tr').dataset.id);
      if (btn.dataset.action === 'editar') editarVentaRegistrada(id);
      if (btn.dataset.action === 'factura') generarFacturaDesdeVenta(id);
      if (btn.dataset.action === 'eliminar') eliminarVentaRegistrada(id);
    });
  }

  function editarVentaRegistrada(id) {
    const venta = ventasReales.find(v => v.id === id);
    if (!venta) { showToast('Venta no encontrada.', 'error'); return; }

    const html = `
      <h2>Corregir venta #${id}</h2>
      <div class="form-section">
        <div style="padding: 12px; background: rgba(255,255,255,0.04); border-radius: 20px; margin-bottom: 16px;">
          <div style="font-weight: 600;">${escapeHtml(venta.nombre_item)}</div>
          <div style="font-size: 0.8rem; color: #aaa;">${new Date(venta.fecha).toLocaleString()}</div>
        </div>
      </div>
      <label class="form-label">Cantidad</label>
      <input type="number" id="editCantidad" min="1" value="${venta.cantidad || 1}">
      <label class="form-label">Total (RD$)</label>
      <input type="number" id="editTotal" min="0" value="${venta.total || 0}">
      <div class="button-group" style="margin-top:24px;">
        <button id="saveVentaRegBtn" class="small">Guardar</button>
        <button id="cancelVentaRegBtn" class="small danger">Cancelar</button>
      </div>`;
    showModal(html);

    document.getElementById('saveVentaRegBtn').onclick = async () => {
      const cantidad = parseInt(document.getElementById('editCantidad').value);
      const total = Number(document.getElementById('editTotal').value);
      if (!cantidad || cantidad < 1 || isNaN(total) || total < 0) {
        showToast('Ingresa valores válidos para cantidad y total.', 'error');
        return;
      }
      const { error } = await adminSupabase.from('ventas_realizadas').update({ cantidad, total }).eq('id', id);
      if (error) { showToast('Error guardando: ' + error.message, 'error'); return; }
      closeModal();
      showToast('Venta corregida.', 'success');
      await refresh(['ventasReales']);
    };
    document.getElementById('cancelVentaRegBtn').onclick = closeModal;
  }

  function eliminarVentaRegistrada(id) {
    const venta = ventasReales.find(v => v.id === id);
    showConfirm('¿Eliminar este registro de venta? Esto no devuelve el stock automáticamente. La solicitud del cliente relacionada volverá a "pendiente" para que la reproceses o la elimines tú mismo.', async () => {
      const { error } = await adminSupabase.from('ventas_realizadas').delete().eq('id', id);
      if (error) { showToast('Error eliminando: ' + error.message, 'error'); return; }

      // Intenta revertir la solicitud vinculada para que no quede "fantasma" en el Historial de clientes
      let solicitudVinculada = null;
      if (venta?.solicitud_id) {
        solicitudVinculada = solicitudesVenta.find(s => s.id === venta.solicitud_id);
      }
      if (!solicitudVinculada && venta) {
        solicitudVinculada = solicitudesVenta.find(s => s.estado === 'completada' && s.producto === venta.nombre_item && (s.telefono || '') === (venta.cliente_telefono || ''));
      }

      if (solicitudVinculada) {
        const { error: revertError } = await adminSupabase.from('ventas_contactos').update({ estado: 'pendiente' }).eq('id', solicitudVinculada.id);
        if (revertError) showToast('Venta eliminada, pero no se pudo revertir la solicitud: ' + revertError.message, 'error');
        else showToast('Venta eliminada. La solicitud volvió a pendiente.', 'success');
      } else {
        showToast('Venta eliminada. No se encontró una solicitud vinculada (registro antiguo).', 'success');
      }
      await refresh(['ventasReales', 'solicitudesVenta']);
    }, 'Eliminar');
  }

  // ================= FACTURACIÓN =================
  // Las facturas son documentos independientes para impresión/imagen — no
  // afectan stock ni ingresos por si mismas. Se pueden crear desde cero
  // (venta de mostrador) o generar a partir de una venta ya registrada.
  function generarNumeroFactura() {
    const n = facturas.length + 1;
    return `F-${String(n).padStart(5, '0')}`;
  }

  function renderFacturacion() {
    const panel = document.getElementById('facturacionPanel');
    if (!panel) return;
    panel.innerHTML = `
      <div class="panel-toolbar">
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button id="addFacturaBtn" class="small">+ Nueva factura</button>
          <button id="facturaDesdeClienteBtn" class="small">📋 Desde cliente registrado</button>
        </div>
        <input type="text" id="facturasSearch" class="search-input" placeholder="🔍 Buscar por cliente, producto o número...">
      </div>
      <div id="facturasTableContainer"></div>`;
    document.getElementById('addFacturaBtn').onclick = () => showFacturaForm();
    document.getElementById('facturaDesdeClienteBtn').onclick = () => mostrarSelectorClienteParaFactura();
    document.getElementById('facturasSearch').addEventListener('input', (e) => renderFacturasTable(e.target.value));
    renderFacturasTable('');
  }

  // Permite elegir un cliente del historial (con sus compras ya confirmadas)
  // y generar la factura de una compra puntual que nunca se facturo, sin
  // depender de la seccion oculta "Ventas registradas".
  function mostrarSelectorClienteParaFactura() {
    const clientes = agruparClientes();
    if (clientes.length === 0) { showToast('No hay clientes con compras registradas.', 'error'); return; }
    const opcionesClientes = clientes.map((c, idx) => `<option value="${idx}">${escapeHtml(c.nombre)}${c.telefono ? ' · ' + escapeHtml(c.telefono) : ''}</option>`).join('');
    const html = `
      <h2>Generar factura desde cliente</h2>
      <p style="color:#aaa; font-size:0.85rem; margin-bottom:16px;">Selecciona el cliente y la compra que quieres facturar. Los datos se prellenan automáticamente.</p>
      <label class="form-label">Cliente</label>
      <select id="clienteFacturaSelect"><option value="">Selecciona un cliente</option>${opcionesClientes}</select>
      <label class="form-label">Compra</label>
      <select id="compraFacturaSelect" disabled><option value="">Selecciona un cliente primero</option></select>
      <div class="button-group" style="margin-top:20px;">
        <button id="continuarFacturaClienteBtn" class="small">Continuar</button>
        <button id="cancelarFacturaClienteBtn" class="small danger">Cancelar</button>
      </div>`;
    showModal(html);

    const clienteSelect = document.getElementById('clienteFacturaSelect');
    const compraSelect = document.getElementById('compraFacturaSelect');

    clienteSelect.addEventListener('change', () => {
      const idx = clienteSelect.value;
      if (idx === '') {
        compraSelect.disabled = true;
        compraSelect.innerHTML = '<option value="">Selecciona un cliente primero</option>';
        return;
      }
      const cliente = clientes[Number(idx)];
      compraSelect.disabled = false;
      compraSelect.innerHTML = '<option value="">Selecciona una compra</option>' + cliente.compras
        .slice()
        .sort((a, b) => new Date(b.fecha) - new Date(a.fecha))
        .map((compra, cIdx) => `<option value="${cIdx}">${escapeHtml(compra.producto)} · ${new Date(compra.fecha).toLocaleDateString()} · ${formatCurrency(compra.precio * compra.cantidad)}</option>`)
        .join('');
    });

    document.getElementById('continuarFacturaClienteBtn').onclick = () => {
      const idx = clienteSelect.value;
      if (idx === '') { showToast('Selecciona un cliente.', 'error'); return; }
      const cIdx = compraSelect.value;
      if (cIdx === '') { showToast('Selecciona una compra.', 'error'); return; }
      const cliente = clientes[Number(idx)];
      const compra = cliente.compras.slice().sort((a, b) => new Date(b.fecha) - new Date(a.fecha))[Number(cIdx)];
      closeModal();
      showFacturaForm({
        producto: compra.producto,
        cantidad: compra.cantidad,
        precio: compra.precio,
        fecha_venta: compra.fecha ? new Date(compra.fecha).toISOString().split('T')[0] : new Date().toISOString().split('T')[0],
        cliente_nombre: cliente.nombre,
        cliente_telefono: cliente.telefono || ''
      });
    };
    document.getElementById('cancelarFacturaClienteBtn').onclick = closeModal;
  }

  function renderFacturasTable(query = '') {
    const container = document.getElementById('facturasTableContainer');
    if (!container) return;
    const filtradas = facturas.filter(f => !query || matches(f.numero_factura, query) || matches(f.cliente_nombre, query) || matches(f.producto, query));
    if (filtradas.length === 0) {
      container.innerHTML = `<div class="empty-message">${facturas.length === 0 ? 'No hay facturas generadas todavía' : 'Sin resultados para tu búsqueda'}</div>`;
      return;
    }
    let html = `<div class="table-wrapper"><table><thead><tr><th>Número</th><th>Tipo</th><th>Fecha</th><th>Cliente</th><th>Producto/Servicio</th><th>Vendedor</th><th>Total</th><th>Acciones</th></tr></thead><tbody>`;
    filtradas.forEach(f => {
      const esServicio = f.tipo === 'servicio';
      html += `<tr data-id="${f.id}">
        <td>${escapeHtml(f.numero_factura)}</td>
        <td><span class="status ${esServicio ? 'en_progreso' : 'completada'}">${esServicio ? 'Servicio' : 'Venta'}</span></td>
        <td>${f.fecha_venta ? new Date(f.fecha_venta).toLocaleDateString() : '—'}</td>
        <td>${escapeHtml(f.cliente_nombre)}</td>
        <td>${escapeHtml(f.producto)}</td>
        <td>${escapeHtml(f.vendedor || '—')}</td>
        <td>${formatCurrency(f.total)}</td>
        <td><button class="small" data-action="ver">Ver / Descargar</button><button class="small danger" data-action="eliminar">Eliminar</button></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
    container.innerHTML = html;
    container.querySelector('table').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const id = Number(btn.closest('tr').dataset.id);

  function generarFacturaDesdeVenta(id) {
    const venta = ventasReales.find(v => v.id === id);
    if (!venta) { showToast('Venta no encontrada.', 'error'); return; }
    const cantidad = venta.cantidad || 1;
    const precioUnitario = cantidad > 0 ? (venta.total || 0) / cantidad : (venta.total || 0);
    showFacturaForm({
      producto: venta.nombre_item,
      cantidad,
      precio: precioUnitario,
      fecha_venta: venta.fecha ? new Date(venta.fecha).toISOString().split('T')[0] : new Date().toISOString().split('T')[0],
      cliente_nombre: venta.cliente_nombre || '',
      cliente_telefono: venta.cliente_telefono || '',
      venta_id: venta.id
    });
  }

  // ================= PUNTOS Y REFERIDOS =================
  // Los puntos NUNCA se guardan acumulados — se recalculan en vivo cada vez
  // a partir de las compras reales y los vinculos activos en `referidos`.
  // Esto hace que fusionar o quitar una fusion sea instantaneo y siempre
  // recalcule el historial completo correctamente, sin datos corruptos.
  function getPuntosPorUnidad(nombreItem) {
    const item = productos.find(p => p.nombre === nombreItem) || accesorios.find(a => a.nombre === nombreItem);
    return item ? Number(item.puntos) || 0 : 0;
  }

  function calcularRankingPuntos() {
    const clientesBase = agruparClientes();
    const referidosActivos = referidos.filter(r => r.activo);
    const referidorDe = new Map(referidosActivos.map(r => [r.referido_key, r.referidor_key]));

    function raizReferidor(key, visited = new Set()) {
      if (visited.has(key)) return key;
      visited.add(key);
      const arriba = referidorDe.get(key);
      if (!arriba || arriba === key) return key;
      return raizReferidor(arriba, visited);
    }

    const resultado = new Map();
    clientesBase.forEach(c => {
      const puntosPropios = c.compras.reduce((sum, compra) => sum + getPuntosPorUnidad(compra.producto) * compra.cantidad, 0);
      resultado.set(c.key, { cliente: c, puntosPropios, puntosTotal: puntosPropios, comprasTotal: c.compras.length, fusionadoCon: null, fusionadosDe: [] });
    });

    clientesBase.forEach(c => {
      if (referidorDe.has(c.key)) {
        const raiz = raizReferidor(c.key);
        if (raiz !== c.key && resultado.has(raiz)) {
          resultado.get(raiz).puntosTotal += resultado.get(c.key).puntosPropios;
          resultado.get(raiz).comprasTotal += resultado.get(c.key).comprasTotal;
          resultado.get(raiz).fusionadosDe.push(c.nombre);
          resultado.get(c.key).fusionadoCon = resultado.get(raiz).cliente.nombre;
        }
      }
    });

    const ranking = Array.from(resultado.values())
      .filter(r => !r.fusionadoCon)
      .sort((a, b) => b.puntosTotal - a.puntosTotal);
    const fusionados = Array.from(resultado.values()).filter(r => r.fusionadoCon);

    return { ranking, fusionados, todos: resultado };
  }

    const filtrado = ranking.filter(r => !query || matches(r.cliente.nombre, query) || matches(r.cliente.telefono, query));

    if (ranking.length === 0) {
      container.innerHTML = `<div class="empty-message">Aún no hay clientes con puntos</div>`;
      return;
    }
    if (filtrado.length === 0) {
      container.innerHTML = `<div class="empty-message">Sin resultados para tu búsqueda</div>`;
      return;
    }

    let html = `<div class="table-wrapper"><table><thead><tr><th>#</th><th>Cliente</th><th>Compras (con fusiones)</th><th>Puntos</th><th>Fusiones recibidas</th><th>Acciones</th></tr></thead><tbody>`;

      html += `<tr data-key="${escapeHtml(r.cliente.key)}">
        <td>${idx + 1}</td>
        <td>${escapeHtml(r.cliente.nombre)}</td>
        <td>${r.comprasTotal}</td>

    });
    html += `</tbody></table></div>`;

    if (fusionados.length > 0) {
      html += `<div style="margin-top:20px;"><label class="form-label">Fusiones activas</label>`;
      fusionados.forEach(f => {
        html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,255,255,0.04);border-radius:16px;margin-bottom:8px;">
          <span>${escapeHtml(f.cliente.nombre)} → fusionado con <strong>${escapeHtml(f.fusionadoCon)}</strong></span>
          <button class="small danger" data-unfuse-key="${escapeHtml(f.cliente.key)}">Quitar fusión</button>

    container.querySelectorAll('button[data-unfuse-key]').forEach(btn => {
      btn.addEventListener('click', () => quitarFusion(btn.dataset.unfuseKey));
    });
  }

  async function loadChart(type, style) {
    if (currentChart) currentChart.destroy();
    const canvas = document.getElementById('mainChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let labels = [], data = [], titulo = '';
    let isPieOrDoughnut = (style === 'pie' || style === 'doughnut');

    if (type === 'mensual') {
      const hoy = new Date(); const meses = []; const valores = [];
      for (let i = 5; i >= 0; i--) { const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1); meses.push(d.toLocaleString('es', { month: 'short', year: 'numeric' })); valores.push(0); }
      ventasReales.forEach(v => { const fecha = new Date(v.fecha); const diff = (hoy.getFullYear() - fecha.getFullYear()) * 12 + (hoy.getMonth() - fecha.getMonth()); if (diff >= 0 && diff < 6) valores[5 - diff] += v.total || 0; });
      labels = meses; data = valores; titulo = 'Ingresos por mes (RD$)';
    }
    else if (type === 'diario') {
      const hoy = new Date(); const dias = []; const valores = [];
      for (let i = 29; i >= 0; i--) { const d = new Date(hoy); d.setDate(hoy.getDate() - i); dias.push(d.toLocaleDateString('es')); valores.push(0); }
      ventasReales.forEach(v => { const fecha = new Date(v.fecha); const diffDias = Math.floor((hoy - fecha) / (1000 * 60 * 60 * 24)); if (diffDias >= 0 && diffDias < 30) valores[29 - diffDias] += v.total || 0; });
      labels = dias; data = valores; titulo = 'Ingresos diarios (últimos 30 días)';
    }
    else if (type === 'top') {
      const prodCount = {};
      ventasReales.forEach(v => { const nombre = v.nombre_item || (v.producto_id ? productos.find(p => p.id === v.producto_id)?.nombre : 'Desconocido'); if (nombre) prodCount[nombre] = (prodCount[nombre] || 0) + (v.cantidad || 1); });
      const top = Object.entries(prodCount).sort((a, b) => b[1] - a[1]).slice(0, 10);
      labels = top.map(t => t[0]); data = top.map(t => t[1]); titulo = 'Unidades vendidas por producto';
    }
    else if (type === 'rotacion') {
      const prodCount = {};
      ventasReales.forEach(v => { const nombre = v.nombre_item || (v.producto_id ? productos.find(p => p.id === v.producto_id)?.nombre : 'Desconocido'); if (nombre) prodCount[nombre] = (prodCount[nombre] || 0) + (v.cantidad || 1); });
      const baja = Object.entries(prodCount).filter(([_, cant]) => cant <= 2);
      labels = baja.map(t => t[0]); data = baja.map(t => t[1]); titulo = 'Productos con ≤2 ventas';
      if (labels.length === 0) { canvas.style.display = 'none'; showToast('No hay productos con baja rotación.', 'error'); return; }
      else canvas.style.display = 'block';
    }
    else if (type === 'region') {
      const regionCount = {};
      solicitudesVenta.forEach(s => { if (s.region && s.estado === 'completada') regionCount[s.region] = (regionCount[s.region] || 0) + 1; });
      labels = Object.keys(regionCount); data = Object.values(regionCount); titulo = 'Ventas completadas por región';
      if (labels.length === 0) { canvas.style.display = 'none'; showToast('No hay datos de región todavía.', 'error'); return; }
      else canvas.style.display = 'block';
    }
    else if (type === 'clientes') {
      const top = agruparClientes().sort((a, b) => b.compras.length - a.compras.length).slice(0, 10);
      labels = top.map(c => c.nombre); data = top.map(c => c.compras.length); titulo = 'Compras confirmadas por cliente';
      if (labels.length === 0) { canvas.style.display = 'none'; showToast('Aún no hay clientes con compras confirmadas.', 'error'); return; }
      else canvas.style.display = 'block';
    }

    let chartType = style;
    if (style === 'area') chartType = 'line';
    const extraOptions = {};
    if (style === 'area') extraOptions.fill = true;

    currentChart = new Chart(ctx, {
      type: chartType,
      data: {
        labels,
        datasets: [{
          label: titulo,
          data,
          backgroundColor: isPieOrDoughnut ? ['#0071e3', '#30d158', '#ff9f0a', '#ff453a', '#5e5ce6', '#bf5af2', '#64d2ff', '#ffd60a'] : '#0071e3',
          borderColor: '#30d158',
          borderWidth: 1,
          ...extraOptions
        }]
      },
      options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: 'white' } } } }
    });
  }

  // ================= TABS =================
  function switchTab(tabId) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const activeTab = document.querySelector(`.tab[data-tab="${tabId}"]`);
    if (activeTab) activeTab.classList.add('active');
    const panels = ['productosPanel', 'accesoriosPanel', 'solicitudesPanel', 'clientesPanel', 'facturacionPanel', 'puntosPanel', 'ventasRegistradasPanel', 'reparacionesPanel', 'graficasPanel'];
    panels.forEach(pid => { const el = document.getElementById(pid); if (el) el.classList.add('hidden'); });
    const currentPanel = document.getElementById(`${tabId}Panel`);
    if (currentPanel) currentPanel.classList.remove('hidden');
    if (tabId === 'graficas') renderGraficas();
  }
  document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));

  // ================= ACCESO OCULTO: VENTAS REGISTRADAS =================
  // 5 clics seguidos (en menos de 3s) sobre el titulo "Panel DLIFE" abren el
  // prompt del codigo. Una vez correcto, agrega la pestana a la barra y
  // permanece disponible durante el resto de la sesion (hasta recargar).
  (function setupAccesoOculto() {
    const titulo = document.getElementById('appTitle');
    if (!titulo) return;
    let clicks = 0;
    let resetTimer = null;
    let desbloqueado = false;

    titulo.addEventListener('click', () => {
      if (desbloqueado) return;
      clicks++;
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => { clicks = 0; }, 3000);
      if (clicks >= 5) {
        clicks = 0;
        pedirCodigoAcceso();
      }
    });

    function pedirCodigoAcceso() {
      const html = `
        <h2>Acceso restringido</h2>
        <p style="color:#aaa; font-size:0.85rem; margin-bottom:16px;">Ingresa el código para ver "Ventas registradas".</p>
        <input type="password" id="codigoAccesoInput" placeholder="Código" inputmode="numeric" autocomplete="off">
        <div class="button-group" style="margin-top:16px;">
          <button id="codigoAccesoBtn" class="small">Acceder</button>
          <button id="codigoCancelBtn" class="small danger">Cancelar</button>
        </div>`;
      showModal(html);
      const input = document.getElementById('codigoAccesoInput');
      input.focus();
      const intentar = () => {
        if (input.value === CODIGO_VENTAS_REGISTRADAS) {
          closeModal();
          desbloquear();
        } else {
          showToast('Código incorrecto.', 'error');
        }
      };
      document.getElementById('codigoAccesoBtn').onclick = intentar;
      document.getElementById('codigoCancelBtn').onclick = closeModal;
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') intentar(); });
    }

    function desbloquear() {
      desbloqueado = true;
      const tabsContainer = document.querySelector('.tabs');
      const nuevaTab = document.createElement('div');
      nuevaTab.className = 'tab';
      nuevaTab.dataset.tab = 'ventasRegistradas';
      nuevaTab.textContent = '🧾 Ventas registradas';
      nuevaTab.addEventListener('click', () => switchTab('ventasRegistradas'));
      tabsContainer.appendChild(nuevaTab);
      showToast('Acceso concedido.', 'success');
      switchTab('ventasRegistradas');
    }
  })();

  // ================= LOGIN / LOGOUT =================
  document.getElementById('loginButton').onclick = async () => {
    const email = document.getElementById('adminEmail').value, pwd = document.getElementById('adminPassword').value;
    const { error } = await adminSupabase.auth.signInWithPassword({ email, password: pwd });
    if (error) showToast('Error: ' + error.message, 'error');
    else checkSession();
  };
  document.getElementById('logoutBtn').onclick = async () => { await adminSupabase.auth.signOut(); checkSession(); };
  checkSession();
</script>
</body>
</html>
